<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#3b82f6" />
  <title>社労士 横断宮殿</title>
  <meta name="description" content="横断学習 × アクティブリコール × 忘却曲線で社労士試験に挑む学習アプリ" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/icon.svg" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <link rel="stylesheet" href="./styles.css" />
  <script>
    // 描画前にテーマを適用してチラつきを防ぐ
    (function () {
      var t = localStorage.getItem('sharo.theme');
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="logo">社</span>
      <div>
        <h1>横断宮殿</h1>
        <p class="tagline-sm">社労士 × 横断学習</p>
      </div>
      <button id="theme-toggle" class="icon-btn" aria-label="テーマ切替" title="ライト/ダーク切替">🌙</button>
    </div>
  </header>

  <main id="view" class="view"><!-- 画面はJSで描画 --></main>

  <nav class="bottom-nav">
    <button class="nav-item active" data-route="home"><span class="ni-ico">🏠</span><span>ホーム</span></button>
    <button class="nav-item" data-route="cross"><span class="ni-ico">🔀</span><span>横断</span></button>
    <button class="nav-item" data-route="review"><span class="ni-ico">🧠</span><span>復習</span></button>
    <button class="nav-item" data-route="growth"><span class="ni-ico">📈</span><span>成長</span></button>
  </nav>

  <script src="./js/content.js"></script>
  <script src="./js/srs.js"></script>
  <script src="./js/storage.js"></script>
  <script src="./js/charts.js"></script>
  <script src="./js/import.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
